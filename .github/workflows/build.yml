name: Build NourQuran APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'NourQuran-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: nourquran-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "NourQuran-source.zip" ]; then
            echo "::error::NourQuran-source.zip was not found in the repository root."
            exit 1
          fi
          unzip -tq NourQuran-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install "platforms;android-35" "build-tools;35.0.0"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK installation failed."
              exit 1
            fi
            sleep 20
          done

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q NourQuran-source.zip -d source
          if [ ! -f "source/NourQuran/settings.gradle" ]; then
            echo "::error::The ZIP does not contain NourQuran/settings.gradle. Check the ZIP folder structure."
            unzip -l NourQuran-source.zip | head -80
            exit 1
          fi

      - name: Build debug APK
        working-directory: source/NourQuran
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s source/NourQuran/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/NourQuran/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NourQuran-debug-APK
          path: source/NourQuran/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NourQuran-build-reports
          path: |
            source/NourQuran/app/build/reports/**
            source/NourQuran/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
